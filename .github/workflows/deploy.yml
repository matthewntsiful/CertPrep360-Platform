# Trigger: pipeline retrigger
name: Deploy to AWS

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

permissions:
  id-token: write
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  # ── Detect what changed ──────────────────────────────────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      infrastructure: ${{ steps.filter.outputs.infrastructure }}
      is_prod: ${{ steps.env.outputs.is_prod }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'website/**'
            backend:
              - 'backend/lambdas/**'
            infrastructure:
              - 'infrastructure/terraform/**'

      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]] || [[ "${{ github.event.inputs.environment }}" == "prod" ]]; then
            echo "is_prod=true" >> $GITHUB_OUTPUT
          else
            echo "is_prod=false" >> $GITHUB_OUTPUT
          fi

  # ── Build Frontend ───────────────────────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.is_prod == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: ./website
        run: npm install --legacy-peer-deps

      - name: Build (dev)
        if: needs.changes.outputs.is_prod == 'false'
        working-directory: ./website
        run: npm run build:dev

      - name: Build (prod)
        if: needs.changes.outputs.is_prod == 'true'
        working-directory: ./website
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: website-build
          path: website/dist/

  # ── Package Lambdas ──────────────────────────────────────────────────────────
  build-lambdas:
    name: Package Lambdas
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.is_prod == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Lambda dependencies
        working-directory: ./backend/lambdas
        run: npm ci

      - name: Package all Lambdas
        working-directory: ./backend/lambdas
        run: |
          LAMBDAS=("admin-analytics" "admin-manage-content" "ai-generate-content" "get-dynamic-quiz" "get-questions" "get-user-analytics" "submit-results" "manage-session" "process-payment" "get-catalog" "marketplace-register" "marketplace-webhook")
          mkdir -p /tmp/lambda-zips
          for DIR in "${LAMBDAS[@]}"; do
            if [ -d "$DIR" ]; then
              echo "📦 Packaging $DIR..."
              STAGING="/tmp/staging_${DIR}"
              rm -rf "$STAGING"
              mkdir -p "$STAGING"
              cp "$DIR/index.js" "$STAGING/"
              cp -r common "$STAGING/"
              cp -r node_modules "$STAGING/"
              cp package.json "$STAGING/"
              cd "$STAGING"
              zip -r "/tmp/lambda-zips/${DIR}.zip" . > /dev/null 2>&1
              cd -
            fi
          done
          ls -la /tmp/lambda-zips/

      - uses: actions/upload-artifact@v4
        with:
          name: lambda-zips
          path: /tmp/lambda-zips/

  # ── Deploy Dev ───────────────────────────────────────────────────────────────
  deploy-dev-frontend:
    name: Deploy Frontend (Dev)
    needs: [changes, build-frontend]
    if: needs.changes.outputs.is_prod == 'false'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: website-build
          path: dist/

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy to S3
        run: |
          aws s3 sync dist/ s3://certprep360-dev-website/ --delete \
            --exclude "index.html" --exclude "sw.js" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp dist/index.html s3://certprep360-dev-website/index.html \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html"
          aws s3 cp dist/sw.js s3://certprep360-dev-website/sw.js \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "application/javascript"

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id E3BJ1TGWKI1MXR --paths "/*"

  deploy-dev-lambdas:
    name: Deploy Lambdas (Dev)
    needs: [changes, build-lambdas]
    if: needs.changes.outputs.is_prod == 'false'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lambda-zips
          path: lambda-zips/

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy all Lambdas
        run: |
          declare -A FUNCTION_MAP
          FUNCTION_MAP["admin-analytics"]="CertPrep360-Dev-AdminAnalytics"
          FUNCTION_MAP["admin-manage-content"]="CertPrep360-Dev-AdminManageContent"
          FUNCTION_MAP["ai-generate-content"]="CertPrep360-Dev-AIGenerateContent"
          FUNCTION_MAP["get-dynamic-quiz"]="CertPrep360-Dev-GetDynamicQuiz"
          FUNCTION_MAP["get-questions"]="CertPrep360-Dev-GetQuestions"
          FUNCTION_MAP["get-user-analytics"]="CertPrep360-Dev-GetUserAnalytics"
          FUNCTION_MAP["submit-results"]="CertPrep360-Dev-SubmitResults"
          FUNCTION_MAP["manage-session"]="CertPrep360-Dev-ManageSession"
          FUNCTION_MAP["process-payment"]="CertPrep360-Dev-ProcessPayment"
          FUNCTION_MAP["get-catalog"]="CertPrep360-Dev-GetCatalog"
          FUNCTION_MAP["marketplace-register"]="CertPrep360-Dev-MarketplaceRegister"
          FUNCTION_MAP["marketplace-webhook"]="CertPrep360-Dev-MarketplaceWebhook"

          for zip in lambda-zips/*.zip; do
            DIR=$(basename "$zip" .zip)
            FUNC="${FUNCTION_MAP[$DIR]}"
            if [ -n "$FUNC" ]; then
              echo "🚀 Deploying $FUNC..."
              aws lambda update-function-code \
                --function-name "$FUNC" \
                --zip-file "fileb://$zip" \
                --query "{LastModified: LastModified, CodeSize: CodeSize}"
              aws lambda wait function-updated --function-name "$FUNC"
              echo ""
            fi
          done
          echo "✅ All Lambdas deployed"

  # ── Prod Approval Gate ───────────────────────────────────────────────────────
  approve-prod:
    name: Approve Production Deployment
    needs: changes
    if: needs.changes.outputs.is_prod == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Approved
        run: echo "Production deployment approved ✅"

  # ── Deploy Prod ──────────────────────────────────────────────────────────────
  deploy-prod-frontend:
    name: Deploy Frontend (Prod)
    needs: [changes, build-frontend, approve-prod]
    if: needs.changes.outputs.is_prod == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: website-build
          path: dist/

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy to S3
        run: |
          aws s3 sync dist/ s3://certprep360-prod-website/ --delete \
            --exclude "index.html" --exclude "sw.js" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp dist/index.html s3://certprep360-prod-website/index.html \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html"
          aws s3 cp dist/sw.js s3://certprep360-prod-website/sw.js \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "application/javascript"

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id E1EJQ7714G35XX --paths "/*"

  deploy-prod-lambdas:
    name: Deploy Lambdas (Prod)
    needs: [changes, build-lambdas, approve-prod]
    if: needs.changes.outputs.is_prod == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lambda-zips
          path: lambda-zips/

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy all Lambdas
        run: |
          declare -A FUNCTION_MAP
          FUNCTION_MAP["admin-analytics"]="CertPrep360-Prod-AdminAnalytics"
          FUNCTION_MAP["admin-manage-content"]="CertPrep360-Prod-AdminManageContent"
          FUNCTION_MAP["ai-generate-content"]="CertPrep360-Prod-AIGenerateContent"
          FUNCTION_MAP["get-dynamic-quiz"]="CertPrep360-Prod-GetDynamicQuiz"
          FUNCTION_MAP["get-questions"]="CertPrep360-Prod-GetQuestions"
          FUNCTION_MAP["get-user-analytics"]="CertPrep360-Prod-GetUserAnalytics"
          FUNCTION_MAP["submit-results"]="CertPrep360-Prod-SubmitResults"
          FUNCTION_MAP["manage-session"]="CertPrep360-Prod-ManageSession"
          FUNCTION_MAP["process-payment"]="CertPrep360-Prod-ProcessPayment"
          FUNCTION_MAP["get-catalog"]="CertPrep360-Prod-GetCatalog"
          FUNCTION_MAP["marketplace-register"]="CertPrep360-Prod-MarketplaceRegister"
          FUNCTION_MAP["marketplace-webhook"]="CertPrep360-Prod-MarketplaceWebhook"

          for zip in lambda-zips/*.zip; do
            DIR=$(basename "$zip" .zip)
            FUNC="${FUNCTION_MAP[$DIR]}"
            if [ -n "$FUNC" ]; then
              echo "🚀 Deploying $FUNC..."
              aws lambda update-function-code \
                --function-name "$FUNC" \
                --zip-file "fileb://$zip" \
                --query "{LastModified: LastModified, CodeSize: CodeSize}"
              aws lambda wait function-updated --function-name "$FUNC"
              echo ""
            fi
          done
          echo "✅ All Lambdas deployed"
