<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="hexGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9900;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#EC7211;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF9900;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </linearGradient>
  </defs>
  
  <!-- Outer hexagon -->
  <polygon points="50,8 85,28 85,72 50,92 15,72 15,28" 
           fill="url(#hexGradient)" 
           stroke="#232F3E" 
           stroke-width="2.5"/>
  
  <!-- Inner hexagon border -->
  <polygon points="50,15 78,32 78,68 50,85 22,68 22,32" 
           fill="none" 
           stroke="#FFFFFF" 
           stroke-width="2" 
           opacity="0.4"/>
  
  <!-- Center circle background -->
  <circle cx="50" cy="50" r="22" 
          fill="#232F3E" 
          opacity="0.2"/>
  
  <!-- AWS text -->
  <text x="50" y="45" 
        font-family="Arial, sans-serif" 
        font-size="14" 
        font-weight="bold" 
        fill="#FFFFFF" 
        text-anchor="middle">AWS</text>
  
  <!-- Certification indicator -->
  <text x="50" y="58" 
        font-family="Arial, sans-serif" 
        font-size="8" 
        font-weight="normal" 
        fill="#FFFFFF" 
        text-anchor="middle" 
        opacity="0.9">CERT</text>
  
  <!-- Top shine effect -->
  <polygon points="50,8 85,28 78,32 50,15" 
           fill="url(#innerGlow)"/>
</svg>
